name: Build Transpose Oitava Integration APK

on:
  workflow_dispatch:
  push:
    branches:
      - test/oitava-integration-2026-09-05
    paths:
      - '.github/workflows/build-oitava-integration-apk.yml'
      - 'app/**'
      - 'core/**'
      - 'media/**'
      - 'audio-effect/**'
      - 'feature/**'
      - 'build-logic/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'

      - name: Prepare local Firebase config for test build
        shell: bash
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "100000000001",
              "project_id": "transpose-oitava-local-test",
              "storage_bucket": "transpose-oitava-local-test.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:100000000001:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.example.transpose"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: transpose-oitava-integration-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
